name: CF优选IP

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt update
          sudo apt install -y curl bc ipcalc

      - name: TCP测速，每个网段随机取1个IP，每个IP测试3次
        run: |
          set +e
          curl -s https://www.cloudflare.com/ips-v4> iprange.txt

          # 判断网段文件是否下载成功
          if [ ! -s iprange.txt ];then
            echo "网段列表下载失败，退出任务"
            exit 1
          fi

          > tmp_result.txt
          > detail.log

          while read -r cidr; do
            [ -z "$cidr" ] && continue
            # 在cidr网段随机生成1个IP
            rand_ip=$(ipcalc -r "$cidr")
            echo "测试网段 $cidr ,随机IP: $rand_ip" >> detail.log

            total=0
            success_cnt=0
            for ((i=0;i<3;i++)); do
              start=$(date +%s.%N)
              # curl探测，超时2秒
              ret=$(curl -o /dev/null -s -w "%{http_code}\n" --connect-timeout 2 "https://${rand_ip}/favicon.ico?_t=$RANDOM")
              end=$(date +%s.%N)
              if [ $? -eq 0 ];then
                delay=$(echo "scale=4; $end - $start" | bc -l)
                total=$(echo "scale=4; $total + $delay" | bc -l)
                success_cnt=$((success_cnt+1))
              fi
            done

            if [ $success_cnt -ge 1 ];then
              avg=$(echo "scale=4; $total / $success_cnt" | bc -l)
              echo "$avg $rand_ip" >> tmp_result.txt
              echo "IP $rand_ip 平均延迟 $avg s,成功次数 $success_cnt" >> detail.log
            fi
          done < iprange.txt

          # 延迟从小到大排序，取前10个可用IP，仅输出IP保存至ip.txt
          sort -n tmp_result.txt | head -n10 | awk '{print $2}' > new_ip.txt

          # 和旧文件对比，无变化就跳过提交
          if cmp -s ip.txt new_ip.txt; then
            echo "测速结果与上次一致，无需更新"
            exit 0
          fi
          mv new_ip.txt ip.txt
        shell: bash

      - name: 提交测速结果
        run: |
          git config user.name "github‑action"
          git config user.email "action@github.com"
          git add ip.txt
          git commit -m "update best ip" || echo "无更新"
          git push
