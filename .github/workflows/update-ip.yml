# （略：文件头和触发器与原来相同）
      - name: Run IP latency checks
        run: |
          set -xeo pipefail

          URL="https://raw.githubusercontent.com/LancelotRar/best-cf-ips/refs/heads/main/best-cf-ipv4.txt"
          RAWLIST="iplist.raw"
          IPS="ips.txt"
          IPTEST="IPtest.txt"
          IPOUT="IP.txt"

          # 下载原始文件
          curl -fsS "$URL" -o "$RAWLIST"

          # 提取合法 IPv4（严格匹配 0-255 范围），并去重后写入 $IPS
          # grep -Po 使用 Perl 正则来限制每个段为 0-255
          grep -Po '((25[0-5]|2[0-4][0-9]|[01]?[0-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9]?[0-9])' "$RAWLIST" | awk '!seen[$0]++' > "$IPS"

          # 初始化输出文件
          : > "$IPTEST"

          # 遍历每个 IP，ping 10 次并取平均延迟
          while IFS= read -r ip || [ -n "$ip" ]; do
            [ -z "$ip" ] && continue
            echo "Testing $ip ..."

            # 关键改动：在命令替换的管道后加上 "|| true"，以防 ping/timeout 返回非0 导致 set -e 中断脚本
            # 该语句会在失败时返回空字符串给 avg（后面会检测并设为 999999）
            avg=$(timeout 30s ping -4 -c 10 -W 3 -q "$ip" 2>/dev/null | awk -F'/' 'END{print $2}' || true)

            # 如果 avg 为空（ping 全丢包或没有 rtt 行），设置为很大值，方便排序时排到后面
            if [ -z "$avg" ]; then
              avg=999999
            fi

            printf "%s %s\n" "$ip" "$avg" >> "$IPTEST"
          done < "$IPS"

          # 排序并输出延迟最低的 10 个 IP
          sort -k2 -n "$IPTEST" | head -n 10 | awk '{print $1}' > "$IPOUT"
