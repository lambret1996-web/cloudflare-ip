# IP 延迟检测（每 6 小时运行，可手动触发）
name: IP Latency Check

# 允许 workflow 使用 GITHUB_TOKEN 写入仓库内容
permissions:
  contents: write

on:
  schedule:
    - cron: "0 */6 * * *" # 每 6 小时运行一次
  workflow_dispatch:     # 支持在 Actions 页面手动触发

jobs:
  ip-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # 把仓库检出到 runner，保留凭证以便后续推送
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Ensure dependencies
        # 安装必要工具：curl、iputils-ping、netcat-openbsd、bc、ipcalc、coreutils
        run: |
          sudo apt-get update
          sudo apt-get install -y curl iputils-ping netcat-openbsd bc ipcalc coreutils

      - name: Run IP latency checks (ICMP then TCP fallback)
        # 主要脚本：下载 IP 列表、提取合法 IPv4、对每个 IP 优先 ICMP，失败则 TCP 回退，生成 IPtest.txt 和 IP.txt，并写 debug.log
        run: |
          # 开启严格模式：打印命令、失败则退出（注意在预期失败的命令后使用 "|| true"）
          set -xeo pipefail

          # 目标 raw 文件地址（包含 IPv4 列表）
        
            URL="https://raw.githubusercontent.com/lambret1996-web/cloudflare-ip/refs/heads/main/ip.txt"

          # 本地临时与输出文件名
          RAWLIST="iplist.raw"    # 下载的原始文件
          IPS="ips.txt"           # 解析并去重后的 IP 列表
          IPTEST="IPtest.txt"     # 每行: "IP 平均延迟(ms)"
          IPOUT="IP.txt"          # 延迟最低的 10 个 IP（每行一个 IP）
          DEBUG="debug.log"       # 调试日志，便于排查 ICMP/TCP 问题

          # 初始化输出文件（清空或创建）
          : > "$IPTEST"
          : > "$IPOUT" || true
          : > "$DEBUG"

          # -------------------------
          # 1) 下载远端 raw 文件
          # -------------------------
          curl -fsS "$URL" -o "$RAWLIST"

          # -------------------------
          # 2) 提取合法 IPv4 并去重
          # -------------------------
          grep -Po '((25[0-5]|2[0-4][0-9]|[01]?[0-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9]?[0-9])' "$RAWLIST" | awk '!seen[$0]++' > "$IPS"

          # -------------------------
          # 调试：确认 runner 是否能 ping 出网（例如 8.8.8.8）
          # -------------------------
          echo "=== Debug: ping 8.8.8.8 ===" | tee -a "$DEBUG"
          timeout 10s ping -4 -c 3 -W 2 8.8.8.8 2>&1 | tee -a "$DEBUG" || true
          echo "=== End debug ===" | tee -a "$DEBUG"

          # -------------------------
          # helper: ms 时间戳（用于 TCP 探测耗时测量）
          # -------------------------
          now_ms() { date +%s%3N; }

          # -------------------------
          # 4) 遍历每个 IP，执行 ping（优先 ICMP），若 ICMP 无响应则尝试 TCP 回退（443 -> 80）
          # -------------------------
          while IFS= read -r ip || [ -n "$ip" ]; do
            [ -z "$ip" ] && continue

            echo "Testing $ip ..." | tee -a "$DEBUG"

            # 尝试 ICMP ping（3 次），并捕获输出以便解析与调试
            ping_out=$(timeout 10s ping -4 -c 3 -W 2 -q "$ip" 2>&1 || true)
            echo "PING OUTPUT for $ip:" >> "$DEBUG"
            echo "$ping_out" >> "$DEBUG"

            # 从 ping 统计行提取 avg（ms），兼容不同 ping 版本输出
            avg_ms=$(echo "$ping_out" | awk -F'/' '/rtt|round-trip/ {print $5; exit}')
            if [ -z "$avg_ms" ]; then
              avg_ms=$(echo "$ping_out" | awk -F'/' 'END{print $2}')
            fi

            # 如果 avg 为空（例如无 rtt 行），尝试 TCP 连接回退（先 443，再 80）
            if [ -z "$avg_ms" ]; then
              echo "ICMP failed for $ip, trying TCP connect fallback" | tee -a "$DEBUG"
              tcp_success=0
              for port in 443 80; do
                start=$(now_ms)
                # 使用 bash 的 /dev/tcp 做快速连接测试（配合 timeout）
                if timeout 5s bash -c "cat < /dev/null > /dev/tcp/${ip}/${port}" >/dev/null 2>&1; then
                  end=$(now_ms)
                  elapsed_ms=$((end - start))
                  avg_ms="$elapsed_ms"
                  tcp_success=1
                  echo "TCP connect to ${ip}:${port} succeeded in ${avg_ms} ms" | tee -a "$DEBUG"
                  break
                else
                  echo "TCP ${ip}:${port} failed or timed out" | tee -a "$DEBUG"
                fi
              done

              if [ "$tcp_success" -eq 0 ]; then
                # 全部探测失败 -> 标记为不可达（大值）
                avg_ms="999999"
                echo "All probes failed for $ip, marking as 999999" | tee -a "$DEBUG"
              fi
            fi

            # 写入结果文件，格式：IP 平均延迟(ms)
            printf "%s %s\n" "$ip" "$avg_ms" >> "$IPTEST"
          done < "$IPS"

          # -------------------------
          # 5) 排序并输出延迟最低的 10 个 IP 到 IPOUT
          # -------------------------
          sort -k2 -n "$IPTEST" | head -n 10 | awk '{print $1}' > "$IPOUT"

          echo "Wrote results to $IPTEST and top-10 to $IPOUT"
          echo "Saved debug log to $DEBUG"
          ls -lah "$IPTEST" "$IPOUT" "$DEBUG" || true

      - name: Commit results back to repo (debug + safe commit)
        # 使用 GITHUB_TOKEN 自动提交并推送结果（带调试输出并强制 add）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -xeo pipefail

          echo "工作目录列举："
          pwd
          ls -lah .

          echo "查看结果文件（若存在）..."
          echo "---- IPtest.txt ----"
          if [ -f IPtest.txt ]; then cat IPtest.txt; else echo "IPtest.txt 不存在"; fi
          echo "---- IP.txt ----"
          if [ -f IP.txt ]; then cat IP.txt; else echo "IP.txt 不存在"; fi
          echo "---- debug.log ----"
          if [ -f debug.log ]; then sed -n '1,300p' debug.log || true; else echo "debug.log 不存在"; fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 显示 git 状态与差异，便于排查为什么没有被提交
          echo "git status (before add):"
          git status --porcelain=1 --untracked-files=all || true
          git status || true
          echo "git diff (unstaged):"
          git --no-pager diff --no-color || true

          # 强制添加文件以绕过 .gitignore（若不希望强制添加可移除 -f）
          git add -f IPtest.txt IP.txt debug.log || true

          echo "git status (after add):"
          git status --porcelain=1 --untracked-files=all || true
          git --no-pager diff --staged --no-color || true

          # 计算目标分支（优先使用 GITHUB_REF 的 head 部分，若异常则回退为 main）
          BRANCH="${GITHUB_REF#refs/heads/}"
          if [ -z "$BRANCH" ] || [ "$BRANCH" = "$GITHUB_REF" ]; then
            BRANCH="main"
          fi
          echo "Target branch for push: $BRANCH"

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update IP latency results"
            # 推送到目标分支（捕获并打印错误）
            if ! git push origin "HEAD:${BRANCH}"; then
              echo "git push 失败，打印远端和权限信息"
              git remote -v || true
              # 打印最后的错误代码并退出以让 Actions 标记失败
              exit 1
            fi
          fi

      - name: Upload results as artifact
        # 确保即使推送失败也能在 Actions UI 下载到结果
        uses: actions/upload-artifact@v4
        with:
          name: ip-latency-results
          path: |
            IPtest.txt
            IP.txt
            debug.log
