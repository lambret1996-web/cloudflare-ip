name: CF优选IP
on:
  schedule:
    - cron: "0 */6 * * *" #每6小时跑一次
  workflow_dispatch: #支持手动点按钮立即运行

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt update
          sudo apt install -y iputils-ping curl

      - name: 获取CF IPv4网段并测速
        run: |
          curl -s https://www.cloudflare.com/ips-v4 > iprange.txt
          #简单提取前20段，每段取第一个IP测试ping
          > ip.txt
          count=0
          while read range; do
              firstip=$(echo $range|cut -d'/' -f1)
              ping -c 1 -W 2 $firstip >/dev/null 2>&1
              if [ $? -eq 0 ];then
                echo "$firstip" >> ip.txt
                count=$((count+1))
              fi
              if [ $count -ge 10 ];then break;fi
          done < iprange.txt

      - name: 提交更新文件
        run: |
          git config user.name "github‑action"
          git config user.email "action@github.com"
          git add ip.txt
          git commit -m "update best ip" || echo "无更新"
          git push
