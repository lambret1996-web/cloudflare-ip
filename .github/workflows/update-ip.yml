name: CF优选IP

on:
  schedule:
    # 每间隔6小时自动运行一次
    - cron: "0 */6 * * *"
  # 允许手动点击按钮立即执行任务
  workflow_dispatch:

permissions:
  # 赋予工作流写入仓库文件的权限，测速结果ip.txt才能提交保存回仓库
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 把仓库文件下载到虚拟机
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt update
          # curl：下载网段列表
          # netcat-openbsd(nc)：TCP端口连通探测
          # bc：浮点数计算延迟
          # ipcalc：在CIDR网段内生成随机IP
          sudo apt install -y curl netcat-openbsd bc ipcalc

      - name: TCP测速443端口，每个网段随机抽取10个IP，每个IP测3次取平均延迟
        run: |
          # set +e：单条命令失败不要终止整个脚本，部分IP连不上属于正常现象
          set +e

          # 下载Cloudflare官方IPv4网段列表
          curl -s https://www.cloudflare.com/ips-v4 > iprange.txt

          # 清空临时结果文件
          > tmp_result.txt

          # 循环读取iprange.txt里面全部网段
          # -r 参数：禁止反斜杠转义字符，避免网段解析出错
          while read -r range; do
            # 空行直接跳过，防止空网段干扰
            [ -z "$range" ] && continue

            # 每个网段随机抽取10个IP进行测速
            for n in {1..10}; do
              # ipcalc -r 在当前网段 range 内生成一个随机IP地址
              ip=$(ipcalc -r "$range")

              total=0          # 累加成功的延迟总和（单位秒）
              success_cnt=0    # 测速成功次数计数器
              # 单个IP一共测速3次
              for ((i=0;i<3;i++)); do
                # 记录测速开始时间（纳秒精度）
                start=$(date +%s.%N)
                # nc探测443端口，超时2秒，丢弃输出
                nc -z -w 2 "$ip" 443 >/dev/null 2>&1
                ret=$?
                # 记录测速结束时间
                end=$(date +%s.%N)
                # 返回值等于0代表TCP连接成功，统计延迟
                if [ $ret -eq 0 ];then
                    # bc浮点运算，单次延迟保留4位小数
                    delay=$(echo "scale=4; $end - $start" | bc -l)
                    # 累加到总延迟
                    total=$(echo "scale=4; $total + $delay" | bc -l)
                    # 成功次数+1
                    success_cnt=$((success_cnt+1))
                fi
              done

              # 只要至少成功1次，就计算平均延迟，写入临时结果文件
              if [ $success_cnt -ge 1 ];then
                  # 平均延迟 =总延迟 /成功次数
                  avg=$(echo "scale=4; $total / $success_cnt" | bc -l)
                  # 格式：平均延迟 空格 IP，存入tmp_result.txt，后续用来排序
                  echo "$avg $ip" >> tmp_result.txt
              fi
            done
          done < iprange.txt

          # sort -n：按数字从小到大排序（平均延迟由低到高）
          # head -n10：取出前10条延迟最低的记录
          # awk '{print $2}'：只截取第二列也就是IP地址，输出保存到ip.txt
          sort -n tmp_result.txt | head -n10 | awk '{print $2}' > ip.txt

      - name: 提交结果回仓库
        run: |
          # 设置git提交者用户名
          git config user.name "github‑action"
          # 设置git提交者邮箱
          git config user.email "action@github.com"
          # 将ip.txt标记为待提交文件
          git add ip.txt
          # 提交记录，备注信息；|| echo "无更新"：如果本次测速IP和上次一模一样没有变化，commit会报错，直接输出提示跳过报错
          git commit -m "update best ip" || echo "无更新"
          git push
