name: 每5分钟更新IP文本
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v5

      - name: 抓取Cloudflare官方IPv4列表
        run: |
          # 从Cloudflare官方地址下载最新IP段
          curl -s https://www.cloudflare.com/ips-v4 > cloudflare.txt

      - name: 提交更新
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare.txt
          if git diff --cached --quiet; then
            echo "IP列表无变更，跳过提交"
          else
            git commit -m "自动更新Cloudflare官方IPv4列表"
            git push
          fi
