name: 每5分钟更新IP文本
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 抓取网页并提取IP（完全容错，任何情况不中断）
        run: |
          # 关闭所有严格错误检测，保证脚本永远不会因为grep/curl失败退出
          set +eo pipefail
          # 抓取页面，保存到本地，忽略curl报错
          curl -s -A "Mozilla/5.0" --retry 2 https://api.uouin.com/cloudflare.html > cloudflare_raw.html || true
          # 提取IPv4，匹配不到也继续执行
          grep -Eo '[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}' cloudflare_raw.html | sort -u > cloudflare.txt || true
          # 恢复默认错误检测
          set -eo pipefail

      - name: 提交更新到GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare.txt
          # 无变更就跳过提交，有变更就推送
          git diff --quiet && echo "无内容变更，跳过提交" || git commit -m "自动更新IP列表" && git push
