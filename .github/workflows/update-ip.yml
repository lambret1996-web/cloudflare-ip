# IP 延迟检测（每 6 小时运行，可手动触发）
name: IP Latency Check

# 允许 workflow 使用 GITHUB_TOKEN 写入仓库内容
permissions:
  contents: write

on:
  schedule:
    - cron: "0 */6 * * *" # 每 6 小时运行一次
  workflow_dispatch:     # 支持在 Actions 页面手动触发

jobs:
  ip-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Ensure dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl coreutils openssl

      - name: Run IP latency checks (HTTP/TLS-WS)
        run: |
          set -xeo pipefail

          URL="https://raw.githubusercontent.com/LancelotRar/best-cf-ips/refs/heads/main/best-cf-ipv4.txt"

          RAWLIST="iplist.raw"
          IPS="ips.txt"
          IPTEST="IPtest.txt"
          IPOUT="IP.txt"
          DEBUG="debug.log"
          RESULTS_TMP="results.tmp"

          : > "$IPTEST"
          : > "$IPOUT" || true
          : > "$DEBUG"
          : > "$RESULTS_TMP"

          curl -fsS "$URL" -o "$RAWLIST"
          grep -Po '((25[0-5]|2[0-4][0-9]|[01]?[0-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9]?[0-9])' "$RAWLIST" | awk '!seen[$0]++' > "$IPS"

          now_ms() { date +%s%3N; }

          test_http_request() {
            local ip="$1"
            local port="${2:-443}"
            local use_https="${3:-true}"
            
            local protocol="http"
            [ "$use_https" = "true" ] && protocol="https"

            local start=$(now_ms)
            local response=$(timeout 1s curl -fsS \
              --resolve "example.com:${port}:${ip}" \
              --cacert /dev/null \
              --insecure \
              --max-time 1 \
              --connect-timeout 1 \
              --write-out "%{http_code}" \
              -o /dev/null \
              "${protocol}://example.com:${port}/favicon.ico" 2>&1 || echo "000")

            local end=$(now_ms)
            local elapsed_ms=$((end - start))

            if [[ "$response" =~ ^[23][0-9]{2}$ ]]; then
              echo "$elapsed_ms"
              return 0
            else
              echo "9999"
              return 1
            fi
          }

          test_tls_handshake() {
            local ip="$1"
            local port="${2:-443}"

            local start=$(now_ms)
            local tls_out=$(timeout 1s bash -c "echo | openssl s_client -connect ${ip}:${port} -servername example.com -brief 2>&1" || echo "FAILED")
            local end=$(now_ms)
            local elapsed_ms=$((end - start))

            if echo "$tls_out" | grep -qi "verify return code: 0\|connected to\|depth=0"; then
              echo "$elapsed_ms"
              return 0
            else
              echo "9999"
              return 1
            fi
          }

          while IFS= read -r ip || [ -n "$ip" ]; do
            [ -z "$ip" ] && continue

            echo "Testing: $ip" | tee -a "$DEBUG"

            http_ms="9999"

            http_result=$(test_http_request "$ip" 443 "true" || echo "9999")
            if [ "$http_result" != "9999" ]; then
              http_ms="$http_result"
              echo "  HTTPS:443 → ${http_ms}ms" | tee -a "$DEBUG"
            else
              tls_result=$(test_tls_handshake "$ip" 443 || echo "9999")
              if [ "$tls_result" != "9999" ]; then
                http_ms="$tls_result"
                echo "  TLS:443 → ${http_ms}ms" | tee -a "$DEBUG"
              else
                http_result=$(test_http_request "$ip" 80 "false" || echo "9999")
                if [ "$http_result" != "9999" ]; then
                  http_ms="$http_result"
                  echo "  HTTP:80 → ${http_ms}ms" | tee -a "$DEBUG"
                else
                  echo "  Failed → 9999ms" | tee -a "$DEBUG"
                fi
              fi
            fi

            printf "%s %s\n" "$ip" "$http_ms" >> "$RESULTS_TMP"
          done < "$IPS"

          awk '{
            ip = $1
            http = (($2 == "") ? 9999 : $2 + 0)
            if (http != http) http = 9999
            printf "%s %d\n", ip, http
          }' "$RESULTS_TMP" | sort -k2 -n > "$IPTEST"

          awk '{print $1}' "$IPTEST" | head -n 15 > "$IPOUT"
          
          echo "=== Results ===" | tee -a "$DEBUG"
          head -n 15 "$IPTEST" | tee -a "$DEBUG"

      - name: Commit results back to repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -xeo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f IPtest.txt IP.txt debug.log || true

          BRANCH="${GITHUB_REF#refs/heads/}"
          [ -z "$BRANCH" ] || [ "$BRANCH" = "$GITHUB_REF" ] && BRANCH="main"

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update IP latency results (HTTP/TLS tests)"
            git push origin "HEAD:${BRANCH}"
          fi

      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ip-latency-results
          path: |
            IPtest.txt
            IP.txt
            debug.log
