name: 每5分钟更新IP文本
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 抓取网页并提取IP（完全容错）
        run: |
          set +eo pipefail
          curl -s -A "Mozilla/5.0" --retry 2 https://api.uouin.com/cloudflare.html > cloudflare_raw.html || true
          grep -Eo '[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}' cloudflare_raw.html | sort -u > cloudflare.txt || true
          set -eo pipefail

      - name: 提交更新
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare.txt
          git diff --quiet && echo "无内容变更，跳过提交" || git commit -m "自动更新IP列表" && git push
