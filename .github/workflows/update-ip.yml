name: 每5分钟更新Cloudflare优选单IP
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v5

      - name: 抓取国内优选Cloudflare单IP
        run: |
          # 优选IP接口，返回纯IPv4单IP列表
          curl -s https://cf.ipdb.xyz/bestcf > cloudflare.txt

      - name: 提交更新
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare.txt
          if git diff --cached --quiet; then
            echo "优选IP无变更，跳过提交"
          else
            git commit -m "自动更新国内优选Cloudflare单IP列表"
            git push
          fi
