name: IP Latency Check

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch:

jobs:
  ip-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Ensure ping available
        run: |
          sudo apt-get update
          sudo apt-get install -y iputils-ping coreutils

      - name: Run IP latency checks
        run: |
          set -xeo pipefail

          URL="https://raw.githubusercontent.com/LancelotRar/best-cf-ips/refs/heads/main/best-cf-ipv4.txt"
          RAWLIST="iplist.raw"
          IPS="ips.txt"
          IPTEST="IPtest.txt"
          IPOUT="IP.txt"

          # fetch list
          curl -fsS "$URL" -o "$RAWLIST"

          # extract IPv4 addresses, dedupe, write to file (FIXED: pipe + redirect)
          grep -Eo '([0-9]{1,3}\.){3}[0-9]{1,3}' "$RAWLIST" | awk '!seen[$0]++' > "$IPS"

          # prepare output file
          : > "$IPTEST"

          # for each IP do 10 pings and record average (ms)
          while IFS= read -r ip; do
            [ -z "$ip" ] && continue
            echo "Testing $ip ..."
            # timeout per-IP to avoid hangs (30s). Force IPv4.
            avg=$(timeout 30s ping -4 -c 10 -W 3 -q "$ip" 2>/dev/null | awk -F'/' 'END{print $2}')
            if [ -z "$avg" ]; then
              # unreachable or timeout -> very large value so it sorts to bottom
              avg=999999
            fi
            printf "%s %s\n" "$ip" "$avg" >> "$IPTEST"
          done < "$IPS"

          # sort numeric by latency and take lowest 10 IPs
          sort -k2 -n "$IPTEST" | head -n 10 | awk '{print $1}' > "$IPOUT"

          echo "Wrote results to $IPTEST and top-10 to $IPOUT"

      - name: Commit results back to repo (if changed)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -xeo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add IPtest.txt IP.txt || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update IP latency results"
            git push
          fi
